# Client node: relays traffic through the encrypted tunnel to exit node(s).
#
#   cd deploy
#   cp client.env.example client.env   # then edit server/keys/psk
#   docker compose -f docker-compose.client.yml up -d --build
#
# In the default (bridge) setup the client tunnels its OWN network namespace:
# the command below applies the README's "client host setup" inside the
# container before starting goproxy, so the real host is not touched. The
# container's traffic goes to the peers' _ROUTES and the rest is blocked.
# Other containers can share that namespace to be tunnelled too -- see the
# commented "app" service below.
#
services:
  goproxy-client:
    build:
      context: ..
      dockerfile: Dockerfile
    image: goproxy:latest
    container_name: goproxy-client
    restart: unless-stopped
    env_file:
      - client.env
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      # lets the reverse-path check see the mark restored on the servers' replies
      net.ipv4.conf.all.src_valid_mark: "1"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        TUN=$${GOPROXY_IFNAME:-goproxy0} MARK=$${GOPROXY_FWMARK:-0x676f} TABLE=26479
        ip tuntap add dev $$TUN mode tun
        ip link set $$TUN up
        ip route add default dev $$TUN table $$TABLE
        # bypass, one rule per prefix (e.g. your LAN, reached via the docker host):
        # ip rule add to 192.168.0.0/16 lookup main pref 1000
        ip rule add lookup main suppress_prefixlength 0 pref 1001
        ip rule add iif $$TUN lookup main pref 1003
        ip rule add not fwmark $$MARK lookup $$TABLE pref 1004
        iptables -t mangle -A OUTPUT -m mark --mark $$MARK -j CONNMARK --save-mark
        iptables -t mangle -A PREROUTING -m connmark --mark $$MARK -j CONNMARK --restore-mark
        exec goproxy node

  # --- Route another container through the tunnel ---
  # It shares the client's network namespace, so all its traffic follows the
  # client's routes. Uncomment to use.
  # app:
  #   image: curlimages/curl:latest
  #   depends_on: [goproxy-client]
  #   network_mode: "service:goproxy-client"
  #   command: ["sh", "-c", "sleep infinity"]

# --- Alternative: gateway for the whole LAN (router points at this host) ---
# Use host networking (network_mode: host) and do the README's "client host
# setup" and "gateway for other devices" on the host itself; then drop the
# entrypoint/command/sysctls above and use:
#   command: ["node"]
# (keep cap_add, devices and env_file).
