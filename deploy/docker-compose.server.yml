# Exit node: accepts client nodes and NATs their traffic to the internet
# (GOPROXY_MASQUERADE=eth0 in server.env).
#
#   cd deploy
#   cp server.env.example server.env   # then edit keys/psk/peers
#   docker compose -f docker-compose.server.yml up -d --build
#
services:
  goproxy-server:
    build:
      context: ..
      dockerfile: Dockerfile
    image: goproxy:latest
    container_name: goproxy-server
    restart: unless-stopped
    env_file:
      - server.env
    # Required to create the TUN device and for the GOPROXY_MASQUERADE rules.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # IP forwarding in the container's own network namespace (namespaced sysctl).
    sysctls:
      net.ipv4.ip_forward: "1"
    # Client traffic is masqueraded out of eth0 (the docker bridge) by the node
    # (GOPROXY_MASQUERADE), then the docker host NATs it to the internet.
    command: ["node"]
    # Expose the listen port. Must match GOPROXY_LISTEN in server.env.
    ports:
      - "443:443"

    # --- Alternative: host networking (for a dedicated VPS) ---
    # Listen on the host IP directly and NAT via the real host interface:
    #   network_mode: host
    # Set GOPROXY_MASQUERADE to the host's uplink (e.g. eth0), enable
    # net.ipv4.ip_forward on the host, and drop the ports/sysctls above
    # (keep cap_add, devices, env_file and command).
