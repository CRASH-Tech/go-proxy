# Release on a version tag (e.g. v0.1.0, v0.2.0-rc1):
#   - static Linux binaries (amd64, arm64, armv7) + SHA256SUMS on a GitHub release;
#   - a multi-arch image on Docker Hub, tagged with the version and, unless the
#     tag is a pre-release (contains "-"), also "latest".
#
# Repository settings:
#   secrets   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN  (Docker Hub access token)
#   variable  DOCKER_IMAGE (optional, default crashntech/go-proxy)
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release

env:
  IMAGE: ${{ vars.DOCKER_IMAGE || 'crashntech/go-proxy' }}
  PRERELEASE: ${{ contains(github.ref_name, '-') }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          mkdir dist
          for target in amd64 arm64 arm:7; do
            arch=${target%%:*}
            goarm=${target#*:}; [ "$goarm" = "$target" ] && goarm=
            name=goproxy-linux-$arch${goarm:+v$goarm}
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch GOARM=$goarm \
              go build -trimpath -ldflags "-s -w" -o "dist/$name" .
          done
          cd dist && sha256sum goproxy-* > SHA256SUMS && cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}"
          fi

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3 # the runtime stage's apk runs per platform
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ env.PRERELEASE != 'true' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
